<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sayfa 01 Sesi</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>🔊 Çizgi Roman Sesi Çalıyor...</h2>
  
  <!-- Ses dosyası burada bağlanıyor -->
  <audio id="sesOynatici" autoplay controls>
    <source src="sayfa01.mp3" type="audio/mpeg">
    Tarayıcınız ses ögesini desteklemiyor.
  </audio>

  <script>
    // Mobil tarayıcılar bazen otomatik çalmayı engellediği için ilk dokunuşta çalmasını tetikler
    window.addEventListener('click', function() {
      var audio = document.getElementById('sesOynatici');
      if (audio.paused) {
        audio.play();
      }
    });
  </script>
</body>
</html>
